<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">

<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1a;--card:#162a29;--tx:#e4f1ef;--mu:#9ab8b5;--pr:#4fc9c0;--on:#05211f;--ok:#5fd18a;--okb:#16372a;--bad:#ff8a7a;--badb:#442522;--bd:#2b4745;--hl:#5a4d12}}
:root[data-theme="dark"]{--bg:#0d1a1a;--card:#162a29;--tx:#e4f1ef;--mu:#9ab8b5;--pr:#4fc9c0;--on:#05211f;--ok:#5fd18a;--okb:#16372a;--bad:#ff8a7a;--badb:#442522;--bd:#2b4745;--hl:#5a4d12}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:.2em 0}
.top{display:flex;justify-content:space-between;padding:12px 16px;background:var(--pr);color:var(--on);font-weight:600}
main{max-width:720px;margin:0 auto;padding:12px 16px 32px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
button.card{display:block;width:100%;text-align:left;color:var(--tx)}
button{font:inherit;cursor:pointer;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;text-align:left}
button:disabled{cursor:default;opacity:.55}.ok,.bad{opacity:1!important}
.pri{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:600;text-align:center}
.opts{display:grid;gap:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok{background:var(--okb)!important;border-color:var(--ok)!important}.bad{background:var(--badb)!important;border-color:var(--bad)!important}
.sel{outline:3px solid var(--pr)}
.fc{min-height:78px;border-left:5px solid var(--pr)}.fc.on{background:var(--hl);border-left-color:var(--ok)}
.txt p{margin:.3em 0;padding:4px 8px;border-radius:8px}.txt p.hl{background:var(--hl)}.txt p.good{background:var(--okb)}
.trap{border-left:5px solid var(--bad)}
input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);margin:6px 0}
.bar{height:8px;background:var(--bd);border-radius:6px}.bar i{display:block;height:100%;background:var(--pr);border-radius:6px}
.mu{color:var(--mu);font-size:.9em}a{color:var(--pr);font-weight:600}
</style></head><body>

r:"Retourne les cartes dans l’ordre. Chaque carte pose une question : réfléchis, puis découvre la réponse.",

c:[fl("beaucoup de","a lot of"),fl("trop de","too much / too many"),fl("très peu de","very little / very few"),fl("tant de","so much / so many"),fl("assez de","enough"),fl("autant de … que","as much … as"),fl("ne … pas","not<br><i>Il ne mange pas équilibré.</i>"),fl("ne … jamais","never<br><i>Elle ne prend jamais l’ascenseur.</i>"),fl("ne … plus","no more / no longer<br><i>Il n’a plus d’énergie.</i>")],

const clr=()=>document.querySelectorAll(".txt p").forEach(p=>p.classList.remove("hl","good"));
function welcome(){
 show(`<div class="card"><h1>Bienvenue, docteur ! 🩺</h1><p>Dans chaque niveau : <b>1. Leçon</b> (tu apprends) → <b>2. Exercices</b> → <b>3. Soumets ton travail à ton prof</b>. Le niveau suivant s’ouvre avec le code de ton prof.</p><input id="nm" placeholder="Ton prénom"><input id="cl" placeholder="Ta classe (ex. 9B)"><button class="pri" id="go">Entrer →</button></div>`);
 $("#go").onclick=()=>{const n=$("#nm").value.replace(/[|#]/g,"").trim();if(!n){$("#nm").focus();return}S.name=n;S.cls=$("#cl").value.replace(/[|#]/g,"").trim();sv();menu()};
}
function menu(){
 if(location.hash=="#prof")return prof();
 if(!S.name&&!PV)return welcome();
 show((PV?`<div class="card"><b>👁️ Mode aperçu prof</b> : tous les niveaux sont ouverts, les bonnes réponses sont entourées, rien n’est enregistré. <button id="xo">Quitter l’aperçu</button></div>`:"")+`<h2>Bonjour ${PV?"professeur":esc(S.name)} !</h2><p class="mu">Leçon → exercices → code pour ton prof → niveau suivant.</p>`+L.map((l,i)=>`<button class="card${LK(i)?" lock":""}" data-i="${i}" ${LK(i)?"disabled":""}>${l.ic} <b>Niveau ${i+1} · ${l.t}</b> ${S.sc[i]?"✅ "+S.sc[i]:LK(i)?"🔒":""}<br><span class="mu">${l.d}</span></button>`).join(""));
 app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>lesson(+b.dataset.i));
 const xo=$("#xo");if(xo)xo.onclick=()=>{PV=false;try{sessionStorage.removeItem("pv")}catch(e){}menu()};
}
function lesson(i){
 const l=L[i],c=l.c||l.p||[],seen=new Set(S.ls[i]?c.map((_,k)=>k):[]);
 show(`<div class="card"><h2>${l.ic} Leçon ${i+1} · ${l.t}</h2><p>${l.r}</p></div>`+(c.length?`<p class="mu">👆 Touche chaque carte pour la retourner : <b id="n"></b></p><div class="cols">${c.map((x,k)=>`<button class="fc" data-k="${k}"><b>${x[0]}</b></button>`).join("")}</div>`:"")+(l.tx?`<div class="card txt">${l.tx.map(p=>`<p>${p}</p>`).join("")}</div>`:"")+`<p><button class="pri" id="go">Aller aux exercices →</button> <button id="m">Menu</button></p>`);
 const upd=()=>{$("#go").disabled=!PV&&seen.size<c.length;const n=$("#n");if(n)n.textContent=seen.size+"/"+c.length};
 app.querySelectorAll(".fc").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,x=c[k],on=b.classList.toggle("on");b.innerHTML=on?x[1]:"<b>"+x[0]+"</b>";seen.add(k);upd()});
 $("#go").onclick=()=>{if(!PV){S.ls[i]=1;sv()}play(i)};$("#m").onclick=menu;upd();
}
function play(i){cur={i,n:0,ok:0,pts:0,st:0,t:0};if(L[i].p)cur.P=sh(L[i].p).slice(0,12);L[i].p?pairs():ask()}
function ask(){
 const l=L[cur.i],t=l.it[cur.n];
 if(!t)return fin(cur.ok,l.it.length);
 cur.t=0;
 show(`<div class="bar"><i style="width:${cur.n/l.it.length*100}%"></i></div><p class="mu">Question ${cur.n+1}/${l.it.length}${cur.st>1?" · 🔥 série de "+cur.st:""} · ${cur.pts} pts</p>`+(l.tx?`<div class="card txt">${l.tx.map((p,k)=>`<p id="p${k}">${p}</p>`).join("")}</div>`:"")+`<div class="card"><p><b>${t[0]}</b></p><div class="opts">${sh([t[1],...t[2]]).map(x=>`<button>${x}</button>`).join("")}</div><p id="fb"></p><div id="nx"></div></div>`);
 if(PV)app.querySelectorAll(".opts button").forEach(b=>{if(b.textContent===t[1])b.style.outline="3px dashed var(--ok)"});
 app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
  if(b.textContent===t[1]){
   const f=cur.t==0;cur.ok+=f?1:0;cur.st=f?cur.st+1:0;cur.pts+=f?(cur.st>2?15:10):5;
   b.classList.add("ok");app.querySelectorAll(".opts button").forEach(x=>x.disabled=true);
   $("#fb").textContent=f?"✅ Bravo !":"✅ Bien, tu as corrigé !";
   if(t[4]!=null){clr();$("#p"+t[4]).classList.add("good")}
   $("#nx").innerHTML='<button class="pri" id="go">Suivant →</button>';$("#go").onclick=()=>{cur.n++;ask()};
  }else{
   b.classList.add("bad");b.disabled=true;cur.t++;cur.st=0;
   $("#fb").textContent="❌ "+(t[3]||"Réfléchis encore !");
   if(t[4]!=null){clr();$("#p"+t[4]).classList.add("hl")}
  }
 });
}
function pairs(){
 const P=cur.P;let sel=null,mi=0,dn=0;
 const col=s=>sh(P.map((p,k)=>[p[s],k])).map(([t,k])=>`<button data-k="${k}" data-s="${s}">${t}</button>`).join("");
 show(`<p class="mu">Touche un mot français, puis sa traduction.</p><div class="cols"><div class="opts">${col(0)}</div><div class="opts">${col(1)}</div></div><p id="fb"></p>`);
 app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
  if(!sel||sel.dataset.s==b.dataset.s){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
  if(sel.dataset.k==b.dataset.k){
   [sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.disabled=true});sel=null;
   if(++dn==P.length){const s=Math.max(0,P.length-mi);cur.pts=s*10;fin(s,P.length)}
  }else{
   mi++;sel.classList.remove("sel");sel=null;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500);
   $("#fb").textContent="❌ Essaie encore ("+mi+" erreur"+(mi>1?"s":"")+")";
  }
 });
}
function fin(ok,tot){
 const i=cur.i;

  }else{
   b.classList.add("bad");b.disabled=true;cur.st=0;tr++;
   if(tr==1){$("#hn").textContent="💡 Indice : "+t[3];$("#fb").textContent="❌ Pas tout à fait. Essaie encore !"}
   else{bs.forEach(x=>{x.disabled=true;if(x.textContent===t[1])x.classList.add("ok")});$("#fb").textContent="📖 La réponse : "+t[1];nxt()}
  }
 });
}
const op=play,of=fin;
play=i=>L[i].rd?reader(i):op(i);
fin=(ok,tot)=>{const l=L[cur.i];if(l.tx0){l.tx=l.tx0;delete l.tx0}if(cur.vf){cur.vf=0;cur.nx();return}of(ok,tot+(cur.rq||0)+(cur.vn||0))};
function reader(i){
 const l=L[i],Q=l.rd;cur={i,n:0,ok:0,pts:0,st:0};
 const next=()=>{
  const n=cur.n,q=Q[n];
  if(!q){
   if(l.vf)return fin(cur.ok,Q.length);
   show(`<div class="card"><h2>📚 Test de vocabulaire</h2><p>Dernière étape : le vocabulaire et les verbes du texte.</p><button class="pri" id="go">C’est parti →</button></div>`);
   $("#go").onclick=()=>{l.tx0=l.tx;l.tx=null;cur.n=0;cur.rq=Q.length;ask()};return;
  }
  const need=q.ev.length,A=q.a,found=new Set(),got=new Set();let err=0;
  show(`<div class="bar"><i style="width:${n/Q.length*100}%"></i></div><p class="mu">Question ${n+1}/${Q.length}${cur.st>1?" · 🔥 série de "+cur.st:""} · ${cur.pts} pts</p><div class="card"><p><b>${q.q}</b>${A.length>1?` <span class="mu">[${A.length}]</span>`:""}</p><p id="st">① Touche ${need>1?"les "+need+" phrases":"la phrase"} du texte qui ${need>1?"donnent":"donne"} la réponse.</p></div><div class="card txt">${l.h}</div><div class="card" id="ans" hidden><p>② Choisis ${A.length>1?"les "+A.length+" bonnes réponses":"la bonne réponse"} :</p><div class="opts">${sh([...A,...q.o]).map(x=>`<button>${x}</button>`).join("")}</div></div><p id="fb"></p><div id="nx"></div>`);
  if(PV){q.ev.forEach(k=>{app.querySelector('.s[data-s="'+k+'"]').style.outline="2px dashed var(--ok)"});$("#ans").hidden=false;app.querySelectorAll("#ans .opts button").forEach(b=>{if(A.includes(b.textContent))b.style.outline="3px dashed var(--ok)"})}
  app.querySelectorAll(".s").forEach(s=>s.onclick=()=>{
   if(found.size>=need||s.classList.contains("good"))return;
   const k=+s.dataset.s;
   if(q.ev.includes(k)){
    s.classList.add("good");found.add(k);
    if(found.size==need){$("#st").textContent="✅ Bien vu ! Maintenant, la réponse.";$("#ans").hidden=false}
    else $("#st").textContent="✅ Une phrase trouvée ("+found.size+"/"+need+"). Cherche l’autre !";
   }else{
    s.classList.add("bad");setTimeout(()=>s.classList.remove("bad"),600);err++;cur.st=0;
    $("#st").textContent="❌ Ce n’est pas là. Relis le texte !";
   }
  });
  app.querySelectorAll("#ans .opts button").forEach(b=>b.onclick=()=>{
   if(A.includes(b.textContent)){
    b.classList.add("ok");b.disabled=true;got.add(b.textContent);
    if(got.size==A.length){
     const f=err==0;cur.ok+=f?1:0;cur.st=f?cur.st+1:0;cur.pts+=f?(cur.st>2?15:10):5;
     app.querySelectorAll("#ans .opts button").forEach(x=>x.disabled=true);
     $("#fb").textContent=f?"✅ Bravo !":"✅ Bien, tu as corrigé !";
     $("#nx").innerHTML='<button class="pri" id="go">Suivant →</button>';$("#go").onclick=()=>{cur.n++;next()};
    }else $("#fb").textContent="✅ Une bonne réponse, il en reste "+(A.length-got.size)+" !";
   }else{
    b.classList.add("bad");b.disabled=true;err++;cur.st=0;$("#fb").textContent="❌ Pas tout à fait. Relis les phrases vertes !";
   }
  });
 };
 if(l.vf){
  cur.vf=1;cur.nx=()=>{cur.vn=l.it.length;cur.n=0;next()};
  show(`<div class="card"><h2>📖 D’abord, lis le forum</h2><p class="mu">Lis attentivement le texte. Ensuite : le vocabulaire, puis les questions.</p></div><div class="card txt">${l.rt.map(p=>`<p>${p}</p>`).join("")}</div><button class="pri" id="go">J’ai lu le texte → vocabulaire</button>`);
  $("#go").onclick=()=>{cur.n=0;vq()};
 }else next();
}
menu();
})();
</script>
</body></html>
